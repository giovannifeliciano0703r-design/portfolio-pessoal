<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Relatório gerado a partir dos dados preenchidos no portfólio.">
  <title>Relatório | Giovanni Feliciano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#101522;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:40px 20px}.report{width:min(850px,100%);margin:auto;background:#fff;border:1px solid #dfe3eb;border-radius:20px;padding:42px;box-shadow:0 20px 60px rgba(16,21,34,.08)}.eyebrow{color:#6352d9;font-size:.78rem;font-weight:800;letter-spacing:.16em}.report h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0 10px}.muted{color:#626b7c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}.item{border:1px solid #e3e6ed;border-radius:14px;padding:18px}.item strong{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#687184;margin-bottom:7px}.item p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.notes{margin-top:18px}.actions{display:flex;gap:12px;margin-top:30px}button,a{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}button{background:#6352d9;color:#fff}a{background:#eef0f5;color:#202638}@media print{body{padding:0;background:#fff}.report{box-shadow:none;border:0;width:100%}.actions{display:none}}@media(max-width:650px){.report{padding:26px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="report" aria-labelledby="reportTitle">
    <p class="eyebrow">RELATÓRIO</p>
    <h1 id="reportTitle">Relatório do portfólio</h1>
    <p class="muted">Gerado diretamente no navegador, sem envio de dados para um servidor.</p>
    <section class="grid" aria-label="Dados do relatório">
      <div class="item"><strong>Nome</strong><p id="name">—</p></div>
      <div class="item"><strong>E-mail</strong><p id="email">—</p></div>
      <div class="item"><strong>Objetivo</strong><p id="goal">—</p></div>
      <div class="item"><strong>Gerado em</strong><p id="createdAt">—</p></div>
    </section>
    <section class="item notes">
      <strong>Informações adicionais</strong>
      <p id="notes">—</p>
    </section>
    <div class="actions">
      <button type="button" onclick="window.print()">Imprimir / Salvar PDF</button>
      <a href="/">Voltar ao portfólio</a>
    </div>
  </main>
  <script>
    (function(){
      const raw=localStorage.getItem('portfolio-report');
      if(!raw)return;
      try{
        const report=JSON.parse(raw);
        document.querySelector('#name').textContent=report.name||'—';
        document.querySelector('#email').textContent=report.email||'—';
        document.querySelector('#goal').textContent=report.goal||'—';
        document.querySelector('#notes').textContent=report.notes||'—';
        document.querySelector('#createdAt').textContent=report.createdAt?new Date(report.createdAt).toLocaleString('pt-BR'):'—';
      }catch(error){console.error('Não foi possível ler o relatório salvo.',error)}
    })();
  </script>
</body>
</html>
