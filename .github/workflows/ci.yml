name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Persist normalized Fercal image source
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- src/data/fercalImages.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/fercalImages.ts
            git commit -m "fix: remover declaração duplicada das imagens da Fercal"
            git push origin HEAD:main
          else
            echo "Fonte das imagens da Fercal já está normalizada."
          fi
