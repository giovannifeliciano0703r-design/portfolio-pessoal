<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Walkable Atlas — Portfolio by Giovanni.FJ</title>
    <meta name="description" content="Walk through six media worlds, open a Living Atlas of web, AI, open-source projects, writing, and consulting." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Shippori+Mincho:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#faf8f5] text-[#242424] antialiased selection:bg-[#d8c7a9] selection:text-black overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Segundo marco (7.4 km): o registro visual funciona como atalho
      // direto para a publicação correspondente no Instagram.
      const INSTAGRAM_SECOND_MILESTONE = 'https://www.instagram.com/p/C_1hzBcsTQv/';

      document.addEventListener('click', (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;

        const photo = target.closest('#landmark-taupe svg');
        if (!photo) return;

        // Impede que o clique também abra o modal do marco.
        event.preventDefault();
        event.stopPropagation();

        window.open(INSTAGRAM_SECOND_MILESTONE, '_blank', 'noopener,noreferrer');
      }, true);

      // Melhora a indicação visual e a acessibilidade do registro clicável.
      const markPhotoAsInstagramLink = () => {
        const photo = document.querySelector('#landmark-taupe svg');
        if (!photo) return;

        photo.style.cursor = 'pointer';
        photo.setAttribute('role', 'link');
        photo.setAttribute('tabindex', '0');
        photo.setAttribute('aria-label', 'Abrir fotos do segundo marco no Instagram');
        photo.setAttribute('title', 'Clique para abrir as fotos no Instagram');
      };

      const observer = new MutationObserver(markPhotoAsInstagramLink);
      observer.observe(document.body, { childList: true, subtree: true });
      markPhotoAsInstagramLink();
    </script>
  </body>
</html>
